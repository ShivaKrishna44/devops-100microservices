name: CI - Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# OIDC — required for aws-actions/configure-aws-credentials with role-to-assume
permissions:
  id-token: write # Required for requesting the JWT token
  contents: write # Required for actions/checkout + committing updated values files

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  # Set this to the ARN Terraform outputs from iam-github-actions.tf:
  #   terraform output -raw github_actions_ci_role_arn
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Always build every service on every trigger — no change detection.
        # Add/remove entries here if apps/ gains or loses a service.
        service: [order-service, payment-service, user-service, notification-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: apps/${{ matrix.service }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          REPO="${{ env.ECR_REGISTRY }}/${{ matrix.service }}"

          docker build -t ${REPO}:${IMAGE_TAG} -t ${REPO}:latest .
          docker push ${REPO}:${IMAGE_TAG}
          docker push ${REPO}:latest

          echo "Pushed: ${REPO}:${IMAGE_TAG}"

      - name: Update Helm values with new image tag
        run: |
          SERVICE=${{ matrix.service }}
          TAG=${{ github.sha }}
          # Update the values file with new tag
          sed -i "s/tag: .*/tag: \"${TAG}\"/" charts/microservice/values-${SERVICE}.yaml

      - name: Commit updated image tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/microservice/values-${{ matrix.service }}.yaml
          git diff --cached --quiet || git commit -m "ci: update ${{ matrix.service }} image to ${{ github.sha }}"
          # 4 matrix jobs push to main concurrently now that all services
          # always build together — rebase onto the latest remote before
          # pushing so one job's push doesn't get rejected by another's.
          git pull --rebase origin main
          git push

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service, user-service, notification-service]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/${{ matrix.service }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
