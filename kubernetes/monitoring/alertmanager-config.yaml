apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'default'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 10s
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://alertmanager-webhook:9095/webhook'

      - name: 'critical-alerts'
        # Configure Slack/PagerDuty for critical alerts
        webhook_configs:
          - url: 'http://alertmanager-webhook:9095/webhook'
            send_resolved: true

      - name: 'warning-alerts'
        webhook_configs:
          - url: 'http://alertmanager-webhook:9095/webhook'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']
